<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>애플뮤직 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* ============================================================
   TOKENS — studio chrome
   ground: graphite with a faint magenta bias (Apple Music ink)
   accent: #FA243C, Apple Music red
   ============================================================ */
:root{
  --ground:#f6f4f7;
  --stage:#ebe7ee;
  --panel:#ffffff;
  --panel-2:#f4f1f6;
  --line:#e0dae6;
  --line-strong:#cdc4d4;
  --ink:#1b171f;
  --ink-2:#4a4353;
  --muted:#7d7488;
  --accent:#FA243C;
  --accent-soft:rgba(250,36,60,.10);
  --focus:#3b6cf6;
  --radius:12px;
  --dot:rgba(27,23,31,.09);
  color-scheme:light dark;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --ground:#141118;
    --stage:#0e0c12;
    --panel:#1d1922;
    --panel-2:#26212d;
    --line:#332c3c;
    --line-strong:#463c52;
    --ink:#f2edf6;
    --ink-2:#c3bacd;
    --muted:#8d8399;
    --accent:#FF3A55;
    --accent-soft:rgba(255,58,85,.14);
    --focus:#6f92ff;
    --dot:rgba(255,255,255,.07);
  }
}
:root[data-theme="dark"]{
  --ground:#141118;
  --stage:#0e0c12;
  --panel:#1d1922;
  --panel-2:#26212d;
  --line:#332c3c;
  --line-strong:#463c52;
  --ink:#f2edf6;
  --ink-2:#c3bacd;
  --muted:#8d8399;
  --accent:#FF3A55;
  --accent-soft:rgba(255,58,85,.14);
  --focus:#6f92ff;
  --dot:rgba(255,255,255,.07);
}

*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--ground);
  -webkit-text-size-adjust:100%;
  color:var(--ink);
  font-family:"IBM Plex Sans KR","Apple SD Gothic Neo",system-ui,-apple-system,sans-serif;
  font-size:14px;
  line-height:1.5;
  -webkit-font-smoothing:antialiased;
}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--focus);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.app{
  display:grid;
  grid-template-columns:minmax(0,1fr) 400px;
  height:100vh;
  overflow:hidden;
}
@media (max-width:1080px){
  .app{grid-template-columns:1fr;height:auto;overflow:visible}
  /* on a phone nothing may force the page wider than the screen — a single
     over-wide control makes the browser widen the whole layout and everything
     opens looking zoomed in */
  .segmented{flex-wrap:wrap}
  .segmented button{flex:1 1 28%;font-size:11.5px;padding:7px 3px}
  .row{flex-wrap:wrap}
  .sec-body{padding-left:14px;padding-right:14px}
  details.sec > summary{padding-left:14px;padding-right:14px}
  .panel-head{padding-left:14px;padding-right:14px}
}
body.fullview .app{grid-template-columns:1fr}
body.fullview .panel{display:none}
body.fullview .brand{opacity:0}
body.fullview .stage{padding:36px 36px 92px}

/* ---------- stage ---------- */
.stage{
  position:relative;
  background:var(--stage);
  background-image:radial-gradient(var(--dot) 1px, transparent 1px);
  background-size:22px 22px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  padding:56px 32px 104px;
  height:100vh;
  overflow:hidden;
}
@media (max-width:1080px){
  .stage{height:auto;min-height:70vh;padding:32px 16px 84px;overflow:visible}
}

.brand{
  position:absolute;top:0;left:0;right:0;
  display:flex;align-items:center;gap:12px;
  padding:18px 24px;
  pointer-events:none;
}
.brand .mark{
  width:26px;height:26px;border-radius:7px;
  background:var(--accent);
  display:grid;place-items:center;
  box-shadow:0 2px 10px rgba(250,36,60,.35);
}
.brand .mark svg{width:15px;height:15px;fill:#fff}
.brand h1{
  font-family:"Archivo",sans-serif;
  font-weight:800;font-size:14px;letter-spacing:-.02em;
  margin:0;color:var(--ink);
}
.brand .sub{
  font-size:11.5px;color:var(--muted);margin-left:2px;
  letter-spacing:.01em;
}

.stage-tools{
  position:absolute;bottom:0;left:0;right:0;z-index:5;pointer-events:none;
  display:flex;align-items:center;justify-content:center;gap:8px;
  padding:16px;
}
.stage-tools > *{pointer-events:auto}
#fullBtn{background:var(--panel);box-shadow:0 2px 12px rgba(0,0,0,.06)}
.zoom{
  display:flex;align-items:center;gap:2px;
  background:var(--panel);border:1px solid var(--line);
  border-radius:999px;padding:3px;
  box-shadow:0 2px 12px rgba(0,0,0,.06);
}
.zoom button{
  border:0;background:transparent;cursor:pointer;
  width:28px;height:28px;border-radius:999px;
  display:grid;place-items:center;color:var(--ink-2);
}
.zoom button:hover{background:var(--panel-2)}
.zoom .val{
  font-family:"IBM Plex Mono",monospace;font-size:11.5px;
  min-width:46px;text-align:center;color:var(--muted);
  font-variant-numeric:tabular-nums;
}

#viewport{
  transform-origin:top left;
  transition:transform .18s ease;
  flex:none;
}

/* ---------- panel ---------- */
.panel,.panel-body,.sec-body,.field,.row,.song-card,.thumb-pick,.thumb-pick > div{min-width:0}
.panel{
  background:var(--panel);
  border-left:1px solid var(--line);
  display:flex;flex-direction:column;
  height:100vh;min-height:0;
}
@media (max-width:1080px){ .panel{height:auto;max-height:none;border-left:0;border-top:1px solid var(--line)} }

.panel-head{
  padding:16px 18px 12px;
  border-bottom:1px solid var(--line);
  display:flex;align-items:center;gap:10px;flex-wrap:wrap;
}
.lang-sel{
  width:auto;padding:6px 8px;font-size:12px;border-radius:9px;
  background:var(--panel-2);border:1px solid var(--line);cursor:pointer;
}
.panel-head .t{
  font-family:"Archivo",sans-serif;font-weight:700;font-size:12px;
  letter-spacing:.10em;text-transform:uppercase;color:var(--muted);
  margin-right:auto;
}
.panel-body{overflow-y:auto;padding:0 0 40px;flex:1}

details.sec{border-bottom:1px solid var(--line)}
details.sec > summary{
  list-style:none;cursor:pointer;
  padding:13px 18px;
  display:flex;align-items:center;gap:10px;
  font-weight:600;font-size:13.5px;
  user-select:none;
}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary:hover{background:var(--panel-2)}
details.sec > summary .chev{
  margin-left:auto;color:var(--muted);
  transition:transform .18s ease;display:grid;place-items:center;
}
details.sec[open] > summary .chev{transform:rotate(90deg)}
details.sec > summary .num{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;
  color:var(--muted);width:16px;
}
.sec-body{padding:4px 18px 18px;display:flex;flex-direction:column;gap:13px}

/* ---------- controls ---------- */
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.field{display:flex;flex-direction:column;gap:6px}
.field > label,.lbl{
  font-size:11.5px;font-weight:500;color:var(--muted);
  letter-spacing:.01em;
}
input[type=text],input[type=number],select,textarea{
  width:100%;max-width:100%;min-width:0;
  background:var(--panel-2);
  border:1px solid var(--line);
  border-radius:9px;
  padding:8px 10px;
  font-size:13px;
  transition:border-color .15s;
}
input[type=text]:focus,select:focus,input[type=number]:focus{border-color:var(--line-strong)}
select{cursor:pointer;appearance:none;background-image:none;padding-right:10px}
input[type=range]{width:100%;accent-color:var(--accent);height:20px}
input[type=color]{
  width:34px;height:30px;padding:0;border:1px solid var(--line);
  border-radius:8px;background:var(--panel-2);cursor:pointer;
}
input[type=color]::-webkit-color-swatch-wrapper{padding:3px}
input[type=color]::-webkit-color-swatch{border:0;border-radius:5px}

.toggle{
  display:flex;align-items:center;gap:9px;cursor:pointer;
  font-size:13px;font-weight:500;position:relative;
}
.toggle input{
  position:absolute;left:0;top:0;width:1px;height:1px;
  opacity:0;margin:0;pointer-events:none;
}
.toggle .track{
  width:38px;height:22px;border-radius:999px;
  background:var(--line-strong);position:relative;
  transition:background .18s ease;flex:none;
}
.toggle .track::after{
  content:"";position:absolute;top:2px;left:2px;
  width:18px;height:18px;border-radius:999px;background:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
  transition:transform .18s cubic-bezier(.3,1.3,.5,1);
}
.toggle input:checked + .track{background:#34C759}
.toggle input:checked + .track::after{transform:translateX(16px)}
.toggle input:focus-visible + .track{outline:2px solid var(--focus);outline-offset:2px}

.segmented{
  display:flex;background:var(--panel-2);border:1px solid var(--line);
  border-radius:9px;padding:2px;gap:2px;
}
.segmented button{
  flex:1 1 0;min-width:0;border:0;background:transparent;cursor:pointer;
  padding:6px 4px;border-radius:7px;font-size:12px;font-weight:500;
  color:var(--muted);transition:.15s;white-space:nowrap;
}
.segmented button[aria-pressed=true]{
  background:var(--panel);color:var(--ink);font-weight:600;
  box-shadow:0 1px 3px rgba(0,0,0,.12);
}

.btn{
  border:1px solid var(--line);background:var(--panel-2);
  border-radius:9px;padding:8px 12px;font-size:12.5px;font-weight:600;
  cursor:pointer;transition:.15s;white-space:nowrap;
}
.btn:hover{border-color:var(--line-strong)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.danger{color:var(--accent);border-color:transparent;background:transparent;padding:6px 8px}
.btn.danger:hover{background:var(--accent-soft)}
.btn.full{width:100%;text-align:center}

.swatches{display:flex;gap:6px;flex-wrap:wrap}
.swatches button{
  width:24px;height:24px;border-radius:7px;border:1px solid rgba(0,0,0,.14);
  cursor:pointer;padding:0;
}
.hint{font-size:11px;color:var(--muted);line-height:1.45}
.hint.warn{color:var(--accent)}

.divider{height:1px;background:var(--line);margin:2px 0}

/* song cards */
.songs{display:flex;flex-direction:column;gap:10px}
.song-card{
  border:1px solid var(--line);border-radius:11px;
  background:var(--panel-2);padding:10px;
  display:flex;flex-direction:column;gap:9px;
}
.song-card .head{display:flex;align-items:center;gap:8px}
.song-card .idx{
  font-family:"IBM Plex Mono",monospace;font-size:10.5px;color:var(--muted);
  width:18px;flex:none;
}
.song-card .head .grow{flex:1}
.icon-btn{
  border:0;background:transparent;cursor:pointer;color:var(--muted);
  width:24px;height:24px;border-radius:6px;display:grid;place-items:center;
}
.icon-btn:hover{background:var(--panel);color:var(--ink)}
.icon-btn[disabled]{opacity:.28;cursor:default}
.thumb-pick{display:flex;gap:8px;align-items:flex-start}
.thumb-prev{
  width:44px;height:44px;border-radius:6px;flex:none;
  background:#D1D1D6 center/cover no-repeat;
  border:1px solid rgba(0,0,0,.10);
}
.file-btn{
  border:1px dashed var(--line-strong);background:transparent;
  border-radius:8px;padding:6px 9px;font-size:11.5px;cursor:pointer;
  color:var(--ink-2);
}
.file-btn:hover{border-color:var(--accent);color:var(--accent)}

/* ---------- backdrop the device sits on ---------- */
.canvas{
  position:relative;flex:none;
  display:flex;align-items:center;justify-content:center;
}
.canvas.framed{overflow:hidden}
.canvas .bg-fill{position:absolute;inset:0;background-position:center;background-repeat:no-repeat}
.canvas .bg-dim{position:absolute;inset:0}
.canvas > .frame{position:relative;z-index:2}

/* ============================================================
   MOCKUP — iOS Apple Music
   ============================================================ */
.frame{position:relative;flex:none}
.frame .body{
  position:relative;
  background:var(--dev-body,#1c1c1e);
  border-radius:var(--dev-body-r,68px);
  padding:var(--dev-pad-t,11px) var(--dev-pad-x,11px) var(--dev-pad-b,11px);
  box-shadow:
    inset 0 0 0 1.5px rgba(255,255,255,.30),
    inset 0 0 0 3px rgba(0,0,0,.22),
    var(--dev-shadow,0 30px 60px rgba(0,0,0,.28));
}
.frame.plain .body{padding:0;background:none;border-radius:0;box-shadow:none}
.frame.plain .screen{box-shadow:var(--dev-shadow,0 24px 48px rgba(0,0,0,.22))}

.screen{
  position:relative;
  overflow:hidden;
  border-radius:var(--screen-r,55px);
  background:#fff;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","SF Pro Display","Helvetica Neue","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:#fff;
  display:flex;flex-direction:column;
  isolation:isolate;
}
.screen *{box-sizing:border-box}

/* device hardware bits */
.notch{
  position:absolute;top:0;left:50%;transform:translateX(-50%);
  width:164px;height:31px;background:#000;
  border-radius:0 0 20px 20px;z-index:40;
}
.island{
  position:absolute;top:12px;left:50%;transform:translateX(-50%);
  width:125px;height:36px;background:#000;border-radius:20px;z-index:40;
}
.speaker{
  position:absolute;top:-56px;left:50%;transform:translateX(-50%);
  width:64px;height:7px;border-radius:4px;background:rgba(255,255,255,.16);
}
.camera-c{
  position:absolute;top:-56px;left:calc(50% + 52px);
  width:9px;height:9px;border-radius:50%;background:rgba(255,255,255,.18);
}
.home-btn{
  position:absolute;bottom:-72px;left:50%;transform:translateX(-50%);
  width:52px;height:52px;border-radius:50%;
  border:1.5px solid rgba(255,255,255,.22);
}
.side-btn{position:absolute;background:var(--dev-btn,#3a3a3c);border-radius:2px}

/* ---- status bar ---- */
.statusbar{
  position:relative;z-index:30;
  display:flex;align-items:center;
  padding:0 30px;
  flex:none;
  font-feature-settings:"tnum";
}
.sb-left{display:flex;align-items:center;gap:5px;flex:1}
.sb-time{
  font-size:17px;font-weight:600;letter-spacing:-.2px;
  font-variant-numeric:tabular-nums;
}
.sb-right{display:flex;align-items:center;gap:6px}
.sb-right svg{display:block}

/* ---- nav bar ---- */
.navbar{
  display:flex;align-items:center;
  padding:6px 20px 4px;flex:none;position:relative;z-index:30;
}
.glass-btn{
  width:40px;height:40px;border-radius:999px;
  display:grid;place-items:center;flex:none;
}
.glass-group{
  margin-left:auto;display:flex;align-items:center;
  border-radius:999px;height:40px;padding:0 5px;gap:3px;
}
.glass-group .gi{width:38px;height:40px;display:grid;place-items:center}

/* ---- scroll area ---- */
.content{
  flex:1;display:flex;flex-direction:column;min-height:0;
  overflow-y:auto;overflow-x:hidden;
  overscroll-behavior:contain;
  scrollbar-width:none;
}
.content::-webkit-scrollbar{display:none}
.cover-wrap,.pl-title,.pl-artist,.action-row{flex:none}

.cover-wrap{display:flex;justify-content:center;padding:10px 0 0}
.screen.flat .cover{box-shadow:none}
.cover{
  width:70%;
  border-radius:10px;
  background:#D1D1D6 center/cover no-repeat;
  box-shadow:0 10px 26px rgba(0,0,0,.26);
  display:grid;place-items:center;
  overflow:hidden;
}
.cover .ph{width:34%;height:34%;opacity:.42}

.pl-title{
  text-align:center;font-size:25px;font-weight:600;letter-spacing:-.45px;
  margin:16px 20px 0;line-height:1.22;text-wrap:balance;
}
.pl-artist{
  text-align:center;font-size:19px;font-weight:400;letter-spacing:-.2px;
  margin:2px 20px 0;
}

.action-row{
  display:flex;align-items:center;justify-content:center;gap:14px;
  padding:18px 20px 6px;
}
.act-circle{
  width:52px;height:52px;border-radius:999px;flex:none;
  display:grid;place-items:center;
}
.play-pill{
  height:52px;border-radius:999px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  padding:0 34px;min-width:180px;
  font-size:18px;font-weight:600;letter-spacing:-.2px;
}

.tracks{padding:12px 20px 16px;display:flex;flex-direction:column}
.trk{
  display:flex;align-items:center;gap:10px;
  padding:7px 0;position:relative;min-height:60px;
}
.trk + .trk::before,.trk.first::before{
  content:"";position:absolute;top:0;height:.5px;
  left:var(--sep-left,26px);right:0;
  background:var(--sep,rgba(255,255,255,.24));
}
.star{width:16px;flex:none;display:grid;place-items:center}
.star svg{width:14px;height:14px}
.tk-art{
  width:46px;height:46px;border-radius:4px;flex:none;
  background:#D1D1D6 center/cover no-repeat;
  display:grid;place-items:center;overflow:hidden;
  border:.5px solid rgba(0,0,0,.10);
}
.tk-art .ph{width:44%;height:44%;opacity:.42}
.tk-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}
.tk-title{
  font-size:17px;font-weight:500;letter-spacing:-.3px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tk-artist{
  font-size:15px;font-weight:400;letter-spacing:-.2px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.tk-more{flex:none;padding-left:4px}

/* ---- bottom stack ---- */
.bottom{
  position:absolute;z-index:20;
  left:0;right:0;bottom:var(--bottom-offset,10px);
  padding:0 14px;
  display:flex;flex-direction:column;gap:8px;
}
.mini{
  display:flex;align-items:center;gap:10px;
  height:58px;border-radius:20px;padding:0 12px;
}
.mini-art{
  width:40px;height:40px;border-radius:6px;flex:none;
  background:#D1D1D6 center/cover no-repeat;
  display:grid;place-items:center;overflow:hidden;
}
.mini-art .ph{width:46%;height:46%;opacity:.42}
.mini-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:0}
.mini-title{font-size:15.5px;font-weight:600;letter-spacing:-.25px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-artist{font-size:13px;font-weight:400;letter-spacing:-.15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mini-ctl{display:flex;align-items:center;gap:16px;padding-right:4px;flex:none}

.tabrow{display:flex;align-items:center;gap:8px}
.tabbar{
  flex:1;display:flex;align-items:center;justify-content:space-between;
  height:62px;border-radius:26px;padding:0 6px;
}
.tab{
  flex:1;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:3px;height:52px;border-radius:20px;
}
.tab .ic{height:26px;display:grid;place-items:center}
.tab .lb{font-size:10.5px;font-weight:500;letter-spacing:-.1px;white-space:nowrap}
.tab-search{
  width:62px;height:62px;border-radius:999px;flex:none;
  display:grid;place-items:center;
}
.home-ind{
  height:0;display:flex;justify-content:center;align-items:flex-end;
  padding-bottom:8px;margin-top:6px;
}
.home-ind i{
  display:block;width:140px;height:5px;border-radius:3px;
}
.pad-b{flex:none}


@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{transition-duration:.01ms !important;animation-duration:.01ms !important}
}
</style>
</head>
<body>
<div class="app">

  <!-- ============ STAGE ============ -->
  <main class="stage">
    <div class="brand">
      <span class="mark"><svg viewBox="0 0 24 24"><path d="M20 3.5v12.2a3.4 3.4 0 1 1-2-3.1V7.2l-8 1.6v9.4a3.4 3.4 0 1 1-2-3.1V6.3l12-2.8z"/></svg></span>
      <h1>APPLE MUSIC MAKER</h1>
      <span class="sub" id="brandSub"></span>
    </div>

    <div id="viewport"></div>

    <div class="stage-tools">
      <div class="zoom">
        <button type="button" id="zoomOut" aria-label="Zoom out"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 8h10"/></svg></button>
        <span class="val" id="zoomVal">100%</span>
        <button type="button" id="zoomIn" aria-label="Zoom in"><svg width="14" height="14" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 3v10M3 8h10"/></svg></button>
        <button type="button" id="zoomFit" aria-label="Fit" style="width:auto;padding:0 10px;font-size:11.5px;font-weight:600" id="zoomFitLabel"></button>

function palette(){

    onPill:     state.act.pillMode==="auto"

    barShadow:  light ? "0 6px 24px rgba(0,0,0,.24)" : "0 6px 22px rgba(0,0,0,.13)",
    barLine:    light ? "rgba(255,255,255,.16)" : "rgba(0,0,0,.10)"
  };
}

/* ============================================================
   5. SCREEN RENDERER
   ============================================================ */
const viewport = document.getElementById("viewport");
let lastBox = "";
let rafId = null, rafCanvasId = null;
/* one repaint per frame at most — colour pickers and sliders fire far faster than that */
function requestRender(){
  if(rafId) return;
  rafId = requestAnimationFrame(()=>{ rafId = null; renderScreen(); });
}
function requestCanvas(){
  if(rafCanvasId) return;
  rafCanvasId = requestAnimationFrame(()=>{ rafCanvasId = null; applyCanvas(); });
}
/* dragging the cover sliders moves exactly one box: resize it, don't rebuild the phone */
function fastCover(){
  const c = document.querySelector("#screenEl .cover");
  if(!c) return false;
  const cp = screenMetrics().coverPx;
  c.style.width = cp + "px";
  c.style.height = cp + "px";
  c.style.borderRadius = state.pl.radius + "px";
  return true;
}
/* typing only changes a string: patch that one text node instead of rebuilding the screen */
function fastText(key, value){
  const el = document.querySelector(`#screenEl [data-txt="${key}"]`);
  if(!el) return false;
  el.textContent = value;
  return true;
}

function bgCss(){
  const b = state.bg;
  return b.mode==="gradient" ? `linear-gradient(${b.angle}deg, ${b.c1}, ${b.c2})` : b.c1;
}
function artStyle(o){
  if(o.img) return `background-image:url('${o.img}');background-color:${o.color}`;
  return `background-color:${o.color}`;
}
function artInner(o,P){ return o.img ? "" : `<span class="ph">${I.note(P.light?"rgba(255,255,255,.62)":"rgba(0,0,0,.30)")}</span>`; }

function outerRadius(){
  const d = DEVICES[state.device];
  return state.frameOn ? d.sr : (state.roundScreen ? d.sr : 0);
}
function screenMetrics(){
  const d = DEVICES[state.device];
  const isClassic = d.top === "classic";
  const sbH = d.top==="island" ? 59 : d.top==="notch" ? 48 : 22;
  const bottomOffset = (state.homeInd && !isClassic) ? 26 : 12;
  const bottomH = (state.mini.show?58:0) + (state.tab.show?62:0)
                + ((state.mini.show && state.tab.show)?8:0) + bottomOffset;
  const headroom = d.h - sbH - (state.nav.show?48:0) - 80 - (state.act.show?76:0) - bottomH - 76;
  const coverPx = Math.max(72, Math.min(d.w * state.pl.size/100, headroom));
  return {d, isClassic, sbH, bottomOffset, bottomH, coverPx};
}
function canvasGeom(){
  const d = DEVICES[state.device], cv = state.canvas;
  const bez = state.frameOn ? d.bez : [0,0,0];
  const ds  = cv.on ? Math.max(0.2, (cv.devScale ?? 100)/100) : 1;
  /* the canvas is sized from the device at FULL size — otherwise shrinking the
     device shrinks the backdrop with it and nothing appears to change */
  const fw  = d.w + bez[1]*2, fh = d.h + bez[0] + bez[2];
  const rad = Math.abs(cv.tilt) * Math.PI/180;
  const boxW = fw*Math.cos(rad) + fh*Math.sin(rad);
  const boxH = fw*Math.sin(rad) + fh*Math.cos(rad);
  const pad  = cv.on ? cv.pad : 26;
  let cw = boxW + pad*2, ch = boxH + pad*2;
  if(cv.on && cv.ratio === "custom"){
    cw = Math.max(200, Math.min(4000, cv.cw||1080));
    ch = Math.max(200, Math.min(4000, cv.ch||1350));
  } else if(cv.on && cv.ratio !== "auto"){
    const [rw,rh] = cv.ratio.split(":").map(Number), r = rw/rh;
    if(cw/ch < r) cw = ch*r; else ch = cw/r;
  }
  return {cw:Math.round(cw), ch:Math.round(ch), ds};
}
function bgFillCss(cw,ch){
  const cv = state.canvas;
  if(cv.mode === "image" && cv.img){
    let sizeCss, posCss = "center";
    if(cv.fit === "custom"){
      /* 100 % of the slider == exactly "cover" for this image in this box */
      const ar = cv.imgAR || 1;
      const coverPct = Math.max(100, 100 * (ch/cw) * ar);
      sizeCss = (coverPct * cv.zoom / 100).toFixed(2) + "% auto";
      posCss  = `${cv.px}% ${cv.py}%`;
    } else {
      sizeCss = cv.fit === "contain" ? "contain" : "cover";
    }
    return `background-image:url('${cv.img}');background-size:${sizeCss};background-position:${posCss};background-color:${cv.c1}`;
  }
  if(cv.mode === "gradient") return `background:linear-gradient(${cv.angle}deg,${cv.c1},${cv.c2})`;
  return `background:${cv.c1}`;
}
function devTransform(ds){
  const cv = state.canvas;
  const parts = [];
  if(cv.on && ds !== 1) parts.push(`scale(${ds})`);
  if(cv.on && cv.tilt)  parts.push(`rotate(${cv.tilt}deg)`);
  return parts.length ? `transform:${parts.join(" ")};` : "";
}
function devShadowCss(){
  const sh = state.shadows ? state.canvas.shadow : 0;
  return sh<=0 ? "none"
    : `0 ${Math.round(10+sh*0.42)}px ${Math.round(24+sh*0.85)}px rgba(0,0,0,${(0.06+sh*0.0035).toFixed(3)})`;
}

/* Any redraw must leave the backdrop node in place — recreating it re-parses and
   re-decodes the (often multi-MB) background image on every single frame. */
function syncBackdrop(el){
  const cv = state.canvas;
  const {cw, ch} = canvasGeom();
  let fill = el.querySelector(".bg-fill");
  if(!cv.on){
    if(fill) fill.remove();
    const d0 = el.querySelector(".bg-dim"); if(d0) d0.remove();
    return;
  }
  if(!fill){
    fill = document.createElement("div");
    fill.className = "bg-fill";
    el.prepend(fill);
    fill.dataset.rev = "";
  }
  {
    if(cv.mode === "image" && cv.img){
      if(fill.dataset.rev !== String(cv.imgRev||0)){
        fill.style.background = "";
        fill.style.backgroundImage = `url('${cv.img}')`;
        fill.dataset.rev = String(cv.imgRev||0);
      }
      fill.style.backgroundColor = cv.c1;
      if(cv.fit === "custom"){
        const ar = cv.imgAR || 1;
        const coverPct = Math.max(100, 100 * (ch/cw) * ar);
        fill.style.backgroundSize = (coverPct * cv.zoom / 100).toFixed(2) + "% auto";
        fill.style.backgroundPosition = `${cv.px}% ${cv.py}%`;
      } else {
        fill.style.backgroundSize = cv.fit === "contain" ? "contain" : "cover";
        fill.style.backgroundPosition = "center";
      }
    } else {
      fill.dataset.rev = "";
      fill.setAttribute("style", bgFillCss(cw, ch));
    }
  }

  let dim = el.querySelector(".bg-dim");
  if(cv.dim > 0){
    if(!dim){ dim = document.createElement("div"); dim.className = "bg-dim"; fill.after(dim); }
    dim.style.background = `rgba(0,0,0,${(cv.dim/100).toFixed(2)})`;
  } else if(dim) dim.remove();
}

function applyGeom(el){
  const cv = state.canvas;
  const {cw, ch, ds} = canvasGeom();
  el.style.width = cw + "px";
  el.style.height = ch + "px";
  el.style.borderRadius = (cv.on ? cv.radius : 0) + "px";
  el.classList.toggle("framed", cv.on);
  const frame = el.querySelector(".frame");
  if(frame){
    frame.style.transform = devTransform(ds).replace(/^transform:|;$/g,"") || "";
    frame.style.setProperty("--dev-shadow", devShadowCss());
  }
  const box = cw + "x" + ch;
  if(box !== lastBox){ lastBox = box; fitIfAuto(); }
  applyZoom();
}

/* backdrop-only changes: never touches the phone subtree */
function applyCanvas(){
  const el = document.getElementById("canvasEl");
  if(!el){ renderScreen(); return; }
  syncBackdrop(el);
  applyGeom(el);
}

function renderScreen(){
  const d = DEVICES[state.device];
  const P = palette();
  const isClassic = d.top==="classic";
  const sbH = d.top==="island" ? 59 : d.top==="notch" ? 48 : 22;
  const sbPad = d.top==="island" ? 20 : d.top==="notch" ? 15 : 0;
  const sepLeft = state.list.stars ? 26 : 0;

  /* how much room the floating bars claim, so the header can never end up underneath them */
  const {bottomOffset, bottomH, coverPx} = screenMetrics();

  /* -- status bar -- */
  let statusHtml = "";
  if(state.status.show){
    statusHtml = `
      <div class="statusbar" style="height:${sbH}px;padding-top:${sbPad}px;padding-left:${isClassic?8:30}px;padding-right:${isClassic?8:26}px">
        <div class="sb-left">
          <span class="sb-time" data-txt="status.time" style="font-size:${isClassic?12:17}px;color:${P.ink}">${esc(state.status.time)}</span>
          ${state.status.silent?`<span style="display:flex">${I.bellSlash(P.ink)}</span>`:""}
        </div>
        <div class="sb-right">
          ${state.status.signal>0?I.signal(state.status.signal,P.ink):""}
          ${state.status.wifi?I.wifi(P.ink):""}
          ${I.battery(state.status.battery,P.ink,state.status.charging)}
        </div>
      </div>`;
  } else {
    statusHtml = `<div class="statusbar" style="height:${sbH}px"></div>`;
  }

  /* -- nav bar -- */
  let navHtml = "";
  if(state.nav.show){
    const grp = [
      state.nav.person?`<span class="gi">${I.personAdd(P.ink)}</span>`:"",
      state.nav.share?`<span class="gi">${I.share(P.ink)}</span>`:"",
      state.nav.more?`<span class="gi">${I.dots(P.ink,20)}</span>`:""
    ].join("");
    navHtml = `
      <div class="navbar">
        ${state.nav.back?`<span class="glass-btn" style="background:${P.glass}">${I.chevL(P.ink)}</span>`:""}
        ${grp?`<div class="glass-group" style="background:${P.glass}">${grp}</div>`:""}
      </div>`;
  }

  /* -- action row -- */
  let actHtml = "";
  if(state.act.show){
    actHtml = `
      <div class="action-row">
        ${state.act.shuffle?`<span class="act-circle" style="background:${P.glass}">${I.shuffle(P.ink)}</span>`:""}
        <div class="play-pill" style="background:${P.pillBg};color:${P.onPill};${state.shadows?`box-shadow:${P.barShadow}`:""}">
          ${I.play(P.onPill,16)}<span data-txt="act.label">${esc(state.act.label)}</span>
        </div>
        ${state.act.download?`<span class="act-circle" style="background:${P.glass}">${I.download(P.ink)}</span>`:""}
      </div>`;
  }

  /* -- tracks -- */
  const tracksHtml = state.tracks.map((tk,i)=>`
    <div class="trk${i===0?" first":""}">
      ${state.list.stars?`<span class="star">${tk.star?I.star(P.tint):""}</span>`:""}
      ${state.list.art?`<span class="tk-art" style="${artStyle(tk)}">${artInner(tk,P)}</span>`:""}
      <span class="tk-meta">
        <span class="tk-title" data-txt="t${i}.title" style="color:${P.ink}">${esc(tk.title)}</span>
        <span class="tk-artist" data-txt="t${i}.artist" style="color:${P.tint}">${esc(tk.artist)}</span>
      </span>
      ${state.list.more?`<span class="tk-more">${I.dots(P.tint,20)}</span>`:""}
    </div>`).join("");

  /* -- bottom stack -- */
  let miniHtml = "";
  if(state.mini.show){
    miniHtml = `
      <div class="mini" style="background:${P.barBg};border:.5px solid ${P.barLine};${state.shadows?`box-shadow:${P.barShadow}`:""}">
        <span class="mini-art" style="${artStyle(state.mini)}">${artInner(state.mini,P)}</span>
        <span class="mini-meta">
          <span class="mini-title" data-txt="mini.title" style="color:${P.ink}">${esc(state.mini.title)}</span>
          <span class="mini-artist" data-txt="mini.artist" style="color:${P.ink2}">${esc(state.mini.artist)}</span>
        </span>
        <span class="mini-ctl">
          ${state.mini.playing?I.pause(P.ink,15):I.play(P.ink,15)}
          ${I.forward(P.ink,23)}
        </span>
      </div>`;
  }

  let tabHtml = "";
  if(state.tab.show){
    const TABS = [
      {k:"home",  lb:t("tabHome"),    ic:I.house},
      {k:"new",   lb:t("tabNew"),     ic:I.grid},
      {k:"radio", lb:t("tabRadio"),   ic:I.radio},
      {k:"library",lb:t("tabLibrary"),ic:I.library}
    ];
    const items = TABS.map(t=>{
      const on = state.tab.active===t.k;
      const col = on ? state.tab.accent : P.tint;
      return `<span class="tab" style="${on?`background:${P.glass}`:""}">
        <span class="ic">${t.ic(col)}</span>
        <span class="lb" style="color:${on?P.ink:P.tint}">${t.lb}</span>
      </span>`;
    }).join("");
    tabHtml = `
      <div class="tabrow">
        <div class="tabbar" style="background:${P.barBg};border:.5px solid ${P.barLine};${state.shadows?`box-shadow:${P.barShadow}`:""}">${items}</div>
        ${state.tab.search?`<div class="tab-search" style="background:${P.barBg};border:.5px solid ${P.barLine};${state.shadows?`box-shadow:${P.barShadow}`:""}">${I.search(P.tint)}</div>`:""}
      </div>`;
  }

  const bottomHtml = (miniHtml||tabHtml)
    ? `<div class="bottom" style="--bottom-offset:${bottomOffset}px">${miniHtml}${tabHtml}</div>` : "";

  const homeHtml = (state.homeInd && !isClassic)
    ? `<div class="home-ind" style="position:absolute;left:0;right:0;bottom:0;z-index:35"><i style="background:${P.homeInd}"></i></div>` : "";

  /* -- hardware overlay -- */
  let hw = "";
  if(state.frameOn){
    if(d.top==="notch") hw = `<div class="notch"></div>`;
    else if(d.top==="island") hw = `<div class="island"></div>`;
  }

  const screenRadius = outerRadius();

  const screenHtml = `
    <div class="screen${state.shadows?"":" flat"}" id="screenEl" style="width:${d.w}px;height:${d.h}px;border-radius:${screenRadius}px;background:${bgCss()}">
      ${hw}
      ${statusHtml}
      ${navHtml}
      <div class="content">
        <div class="cover-wrap"><div class="cover" style="width:${coverPx}px;height:${coverPx}px;border-radius:${state.pl.radius}px;${artStyle(state.pl)}">${artInner(state.pl,P)}</div></div>
        <div class="pl-title" data-txt="pl.title" style="color:${P.ink}">${esc(state.pl.title)}</div>
        <div class="pl-artist" data-txt="pl.artist" style="color:${P.ink2}">${esc(state.pl.artist)}</div>
        ${actHtml}
        <div class="tracks" style="--sep:${P.sep};--sep-left:${sepLeft}px;padding-bottom:${bottomH + 16}px">${tracksHtml}</div>
      </div>
      ${bottomHtml}
      ${homeHtml}
    </div>`;

  const fc = FRAME_COLORS[state.frameColor];
  const cv = state.canvas;
  const devShadow = devShadowCss();
  let html;
  if(state.frameOn){
    const [bt,bx,bb] = d.bez;
    const sideBtns = isClassic ? "" : `
      <span class="side-btn" style="left:-2.5px;top:${d.h*0.13}px;width:3px;height:26px;background:${fc.btn}"></span>
      <span class="side-btn" style="left:-2.5px;top:${d.h*0.20}px;width:3px;height:52px;background:${fc.btn}"></span>
      <span class="side-btn" style="left:-2.5px;top:${d.h*0.28}px;width:3px;height:52px;background:${fc.btn}"></span>
      <span class="side-btn" style="right:-2.5px;top:${d.h*0.22}px;width:3px;height:84px;background:${fc.btn}"></span>`;
    const classicBits = isClassic ? `
      <span class="speaker" style="top:${-bt/2-4}px"></span>
      <span class="camera-c" style="top:${-bt/2-5}px"></span>
      <span class="home-btn" style="bottom:${-bb/2-26}px;border-color:${fc.btn}"></span>` : "";
    html = `<div class="frame" style="--dev-body:${fc.body};--dev-body-r:${d.br}px;--dev-shadow:${devShadow}">
      <div class="body" style="padding:${bt}px ${bx}px ${bb}px">
        <div style="position:relative">${screenHtml}${classicBits}</div>
        ${sideBtns}
      </div>
    </div>`;
  } else {
    html = `<div class="frame plain" style="--dev-shadow:${devShadow}"><div class="body">${screenHtml}</div></div>`;
  }

  /* ---- place the device on its backdrop ---- */
  const tf = devTransform(canvasGeom().ds);
  if(tf) html = html.replace('style="', `style="${tf}`);   /* fold scale+tilt into the frame's own style attribute */

  let el = document.getElementById("canvasEl");
  if(!el){
    viewport.innerHTML = `<div class="canvas" id="canvasEl"></div>`;
    el = document.getElementById("canvasEl");
  }
  const oldFrame = el.querySelector(".frame");
  if(oldFrame) oldFrame.remove();
  syncBackdrop(el);                      /* keeps the existing background node alive */
  el.insertAdjacentHTML("beforeend", html);
  applyGeom(el);
}
function esc(s){return String(s==null?"":s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/* ============================================================
   6. CONTROL PANEL
   ============================================================ */
function get(p){return p.split(".").reduce((o,k)=>o==null?o:o[k],state);}
function fromDefaults(p){return p.split(".").reduce((o,k)=>o==null?o:o[k], typeof DEFAULTS==="undefined"?null:DEFAULTS);}
/* a settings file saved by an older build won't have every key — heal it instead of
   rendering "undefined" into the UI */
function val(p, fallback){
  let v = get(p);
  if(v === undefined || v === null){
    const d = fromDefaults(p);
    v = (d === undefined || d === null) ? fallback : d;
    set(p, v);
  }
  return v;
}
function set(p,v){const ks=p.split(".");const last=ks.pop();const o=ks.reduce((a,k)=>a[k],state);o[last]=v;}

const SW_BG = ["#FFFFFF","#F2F2F7","#000000","#1C1C1E","#1B8A78","#0B3D5C","#2E2A5E","#7A1F3D","#E8C8D8","#FBE8C8"];
const SW_ART= ["#D1D1D6","#E5E5EA","#8E8E93","#3A3A3C","#FA243C","#FF9F0A","#30D158","#0A84FF","#BF5AF2","#FFFFFF"];

function seg(path,opts){
  const cur=val(path, opts[0][0]);
  return `<div class="segmented" data-b="${path}">${opts.map(o=>`<button type="button" data-v="${o[0]}" aria-pressed="${cur===o[0]}">${o[1]}</button>`).join("")}</div>`;
}
function tog(path,label){
  return `<label class="toggle"><input type="checkbox" data-b="${path}" ${val(path,false)?"checked":""}><span class="track"></span><span>${label}</span></label>`;
}
function txt(path,label,ph=""){
  return `<div class="field"><label>${label}</label><input type="text" data-b="${path}" value="${esc(val(path,""))}" placeholder="${ph}"></div>`;
}
function colorRow(path,label,swatches){
  return `<div class="field"><label>${label}</label><div class="row">
    <input type="color" data-b="${path}" value="${val(path,swatches[0])}">
    <div class="swatches">${swatches.map(c=>`<button type="button" data-sw="${path}" data-c="${c}" style="background:${c}" title="${c}"></button>`).join("")}</div>
  </div></div>`;
}
function rng(path,label,min,max,step,suffix=""){
  const v = val(path, Number(min));
  return `<div class="field"><label>${label} <span class="mono" data-out="${path}">${v}${suffix}</span></label>
    <input type="range" data-b="${path}" data-num="1" min="${min}" max="${max}" step="${step}" value="${v}"></div>`;
}
function artBlock(prefix,labelPrefix,siAttr=""){
  const o = get(prefix);
  const style = o.img?`background-image:url('${o.img}')`:`background-color:${o.color}`;
  return `<div class="field"><label>${labelPrefix} ${t("imgSuffix")}</label>

        </div>
        <input type="text" data-ytin="${prefix}" placeholder="${t('ytPaste')}" value="${esc(o.yt||"")}">
      </div>

      <input type="color" data-b="${prefix}.color" value="${o.color}">
      <div class="swatches">${SW_ART.map(c=>`<button type="button" data-sw="${prefix}.color" data-c="${c}" style="background:${c}"></button>`).join("")}</div>
    </div>

}

function imgPick(prefix,label){

function deviceOptions(){

function renderPanel(){
  const body = document.getElementById("panelBody");
  /* keep the panel where the user left it: which sections are open, and the scroll position */
  const openState = [...body.querySelectorAll("details.sec")].map(d=>d.open);
  const scroll = body.scrollTop;
  body.innerHTML = `
  <details class="sec" open><summary><span class="num">01</span>${t("s1")}<span class="chev">${chev()}</span></summary>
    <div class="sec-body">
      ${tog("frameOn",t("frameOn"))}
      <div class="field"><label>${t("device")}</label><select data-b="device">${deviceOptions()}</select></div>
      <div class="field"><label>${t("frameColor")}</label><select data-b="frameColor">${Object.entries(FRAME_COLORS).map(([k,v])=>`<option value="${k}" ${state.frameColor===k?"selected":""}>${t(v.label)}</option>`).join("")}</select></div>
      ${tog("roundScreen",t("roundScreen"))}
      <div class="hint">${t("roundHint")}</div>
      <div class="divider"></div>
      ${tog("shadows",t("shadows"))}
      <div class="hint">${t("shadowHint")}</div>

/* ============================================================
   7. IMAGE SOURCES  (upload / YouTube thumbnail)
   ============================================================ */
function targetObj(t){
  if(t.startsWith("track:")) return state.tracks[+t.split(":")[1]];
  return get(t);
}
/* A photo straight off a phone is 4000 px wide and several MB as a data URL, which
   is far more than the mockup can use and enough to make saving fail. Cap it. */
const MAX_EDGE = 1600;
async function shrinkImage(dataUrl, keepAlpha){
  const im = await loadImg(dataUrl);
  if(!im || !im.naturalWidth) return dataUrl;
  const long = Math.max(im.naturalWidth, im.naturalHeight);
  if(long <= MAX_EDGE && dataUrl.length < 900000) return dataUrl;
  const k = Math.min(1, MAX_EDGE / long);
  const cv = document.createElement("canvas");
  cv.width  = Math.round(im.naturalWidth  * k);
  cv.height = Math.round(im.naturalHeight * k);
  const cx = cv.getContext("2d");
  cx.drawImage(im, 0, 0, cv.width, cv.height);
  try{
    return keepAlpha ? cv.toDataURL("image/png") : cv.toDataURL("image/jpeg", 0.9);
  }catch(e){ return dataUrl; }
}
function pickFile(cb){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="image/*";
  inp.addEventListener("change",()=>{
    const f = inp.files && inp.files[0];
    if(!f) return;
    const r = new FileReader();
    r.onload = async ()=>{
      const keepAlpha = /png|webp|gif/i.test(f.type || "");
      cb(await shrinkImage(r.result, keepAlpha));
    };
    r.readAsDataURL(f);
  });
  inp.click();
}
function ytId(url){
  const m = String(url).match(/(?:youtu\.be\/|youtube\.com\/(?:watch\?(?:.*&)?v=|embed\/|shorts\/|live\/|v\/))([A-Za-z0-9_-]{11})/);
  if(m) return m[1];
  const bare = String(url).trim();
  return /^[A-Za-z0-9_-]{11}$/.test(bare) ? bare : null;
}
function loadImg(src){
  return new Promise(res=>{ const im=new Image(); im.crossOrigin="anonymous";
    im.onload=()=>res(im); im.onerror=()=>res(null); im.src=src; });
}
/* Re-encode the thumbnail locally so PNG export never hits a tainted canvas. */
async function ytThumb(id){
  for(const name of ["maxresdefault","hqdefault","mqdefault"]){
    const url = `https://i.ytimg.com/vi/${id}/${name}.jpg`;
    const im = await loadImg(url);
    if(im && im.naturalWidth > 8){
      try{
        const side = Math.min(im.naturalWidth, im.naturalHeight);
        const cv = document.createElement("canvas");
        cv.width = cv.height = Math.min(640, side);
        const cx = cv.getContext("2d");
        cx.drawImage(im,(im.naturalWidth-side)/2,(im.naturalHeight-side)/2,side,side,0,0,cv.width,cv.height);
        return cv.toDataURL("image/jpeg",0.92);
      }catch(e){ return url; }   /* tainted: fall back to the live URL */
    }
  }
  return null;
}
let ytTimer = null;
function handleYt(target, value, previewEl){
  const o = targetObj(target);
  o.yt = value;
  clearTimeout(ytTimer);
  const id = ytId(value);
  if(!value.trim()){ o.img = null; refreshPreview(previewEl,o); renderScreen(); return; }
  if(!id) return;
  ytTimer = setTimeout(async ()=>{
    const src = await ytThumb(id);
    if(src){ o.img = src; refreshPreview(previewEl,o); renderScreen(); }
  }, 320);
}
function refreshPreview(el,o){
  if(!el) return;
  el.style.backgroundImage = o.img ? `url('${o.img}')` : "none";
  el.style.backgroundColor = o.color;
}

   8. EVENT WIRING
   ============================================================ */
const REPANEL = new Set(["bg.mode","tintMode","act.pillMode","canvas.mode","canvas.fit","canvas.ratio"]);
const panelBody = document.getElementById("panelBody");

const FAST = new Set(["pl.title","pl.artist","act.label","status.time","mini.title","mini.artist"]);

function readControl(el){
  const p = el.dataset.b;
  if(!p) return;
  let v;
  if(el.type === "checkbox") v = el.checked;
  else if(el.dataset.num) v = Number(el.value);
  else v = el.value;
  set(p, v);
  const out = panelBody.querySelector(`[data-out="${p}"]`);
  if(out){
    const suffix = out.textContent.replace(/^[\d.-]+/,"");
    out.textContent = v + suffix;
  }
  if(/\.color$/.test(p)){
    const field = el.closest(".field");
    const prev = field && field.querySelector(".thumb-prev");
    if(prev) refreshPreview(prev, targetObj(p.replace(/\.color$/,"")));
  }
  /* backdrop sliders never touch the phone itself — update it in place */
  if(p.startsWith("canvas.") && !REPANEL.has(p)) requestCanvas();
  else if((p === "pl.size" || p === "pl.radius") && fastCover()) { /* handled in place */ }
  else requestRender();
  if(REPANEL.has(p)) renderPanel();
}

panelBody.addEventListener("input", e=>{
  const el = e.target;
  if(el.dataset.b){
    const p = el.dataset.b;
    if(el.type === "text" && FAST.has(p)){
      set(p, el.value);
      if(fastText(p, el.value)) return;
    }
    readControl(el); return;
  }
  if(el.dataset.tb !== undefined && el.dataset.si !== undefined){
    const i = +el.dataset.si, key = el.dataset.tb;
    const t = state.tracks[i];
    t[key] = el.value;
    if(key === "color"){
      const prev = el.closest(".song-card").querySelector(".thumb-prev");
      refreshPreview(prev, t);
      requestRender(); return;
    }
    if(fastText(`t${i}.${key}`, el.value)) return;
    requestRender(); return;
  }
  if(el.dataset.ytin !== undefined){
    const prev = el.closest(".thumb-pick").querySelector(".thumb-prev");
    handleYt(el.dataset.ytin, el.value, prev); return;
  }
});
panelBody.addEventListener("change", e=>{ if(e.target.dataset.b) readControl(e.target); });

panelBody.addEventListener("click", e=>{
  const el = e.target.closest("button");
  if(!el) return;

  /* segmented */
  const segWrap = el.closest(".segmented");
  if(segWrap && el.dataset.v !== undefined){
    set(segWrap.dataset.b, el.dataset.v);
    segWrap.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed", b===el));
    requestRender();
    if(REPANEL.has(segWrap.dataset.b)) renderPanel();
    return;
  }
  /* swatch */
  if(el.dataset.sw){
    set(el.dataset.sw, el.dataset.c);
    const inp = panelBody.querySelector(`input[type=color][data-b="${el.dataset.sw}"]`);
    if(inp) inp.value = el.dataset.c;
    const card = el.closest(".song-card") || el.closest(".field");
    const prev = card && card.querySelector(".thumb-prev");
    if(prev){
      const base = el.dataset.sw.replace(/\.color$/,"");
      refreshPreview(prev, targetObj(base));
    }
    requestRender(); return;
  }
  /* image upload / clear */
  if(el.dataset.upload){
    const t = el.dataset.upload;
    pickFile(async src=>{
      const o = targetObj(t); o.img = src; o.yt = "";
      o.imgRev = (o.imgRev || 0) + 1;
      const im = await loadImg(src);
      if(im && im.naturalHeight) o.imgAR = im.naturalWidth / im.naturalHeight;
      renderScreen(); renderPanel();
    });
    return;
  }
  if(el.dataset.clearimg){
    const o = targetObj(el.dataset.clearimg); o.img=null; o.yt="";
    renderScreen(); renderPanel(); return;
  }
  /* track actions */
  if(el.dataset.star !== undefined){
    const t = state.tracks[+el.dataset.star]; t.star = !t.star;
    requestRender(); renderSongs(); return;
  }
  if(el.dataset.mv !== undefined){
    const i = +el.dataset.mv, d = +el.dataset.dir, j = i + d;
    if(j<0 || j>=state.tracks.length) return;
    [state.tracks[i], state.tracks[j]] = [state.tracks[j], state.tracks[i]];
    renderScreen(); renderPanel(); return;
  }
  if(el.dataset.del !== undefined){
    state.tracks.splice(+el.dataset.del,1);
    renderScreen(); renderPanel(); return;
  }
  if(el.id === "addSong"){
    state.tracks.push(newTrack(t("newSong"),t("artist")));
    renderScreen(); renderPanel();
    panelBody.querySelector(".song-card:last-child input[data-tb=title]").focus();
    return;
  }
  if(el.id === "exportBtn2"){ exportPng(); return; }
  if(el.id === "saveJson"){ saveJson(); return; }
  if(el.id === "loadJson"){ loadJson(); return; }
  if(el.id === "resetAll"){
    if(confirm(t("askReset"))){
      Object.keys(DEFAULTS).forEach(k=>{ state[k] = structuredClone(DEFAULTS[k]); });
      fillLangs(); applyChrome(); renderScreen(); renderPanel();
    }
    return;
  }
});

/* ============================================================
   9. ZOOM
   ============================================================ */
let zoom = 1, autoFit = true;
const stageEl = document.querySelector(".stage");
const zoomVal = document.getElementById("zoomVal");
function applyZoom(){
  viewport.style.transform = `scale(${zoom})`;
  /* a transform doesn't shrink the layout box, so the shrunken mockup would still
     reserve its full width and push the page wider than a phone screen */
  const el = viewport.firstElementChild;
  if(el){
    viewport.style.width  = Math.round(el.offsetWidth  * zoom) + "px";
    viewport.style.height = Math.round(el.offsetHeight * zoom) + "px";
  }
  zoomVal.textContent = Math.round(zoom*100) + "%";
}
function fitIfAuto(){
  if(!autoFit) return;
  const f = viewport.firstElementChild;
  if(!f) return;
  const w = f.offsetWidth, h = f.offsetHeight;
  if(!w || !h) return;
  const full = document.body.classList.contains("fullview");
  /* On a phone the panel stacks underneath, so the stage grows with its content and
     its own height can't be used to fit against — measure the window instead. */
  const narrow = window.matchMedia("(max-width:1080px)").matches;
  const availW = stageEl.clientWidth - (narrow ? 28 : full ? 60 : 80);
  const vv = window.visualViewport;
  const availH = narrow ? (vv ? vv.height : window.innerHeight) * 0.70
                        : stageEl.clientHeight - (full ? 120 : 190);
  zoom = Math.min(1, availW/w, availH/h);   /* never blow the mockup up past 100 % */
  applyZoom();
}
document.getElementById("zoomIn").onclick = ()=>{ autoFit=false; zoom=Math.min(2,zoom+0.1); applyZoom(); };
document.getElementById("zoomOut").onclick = ()=>{ autoFit=false; zoom=Math.max(0.15,zoom-0.1); applyZoom(); };
document.getElementById("zoomFit").onclick = ()=>{ autoFit=true; zoom=1; fitIfAuto(); };
window.addEventListener("resize", ()=>fitIfAuto());

  fullBtn.textContent = on ? t("exitFull") : t("full");
  autoFit = true; requestAnimationFrame(fitIfAuto);
}
fullBtn.onclick = ()=> setFull(!document.body.classList.contains("fullview"));

});

/* ============================================================
   10. EXPORT
   ============================================================ */
function download(blobOrUrl, name){
  const a = document.createElement("a");
  a.href = typeof blobOrUrl === "string" ? blobOrUrl : URL.createObjectURL(blobOrUrl);
  a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
}
const exportBtn = document.getElementById("exportBtn");
/* ── WebKit (Safari, and every browser on iOS) rasterises box-shadow without its
   blur AND without its border-radius, so shadows come out as hard rectangles.
   Detect it, then draw the device shadow out of real rounded elements instead. ── */
let shadowBlurOk = null;
function looksLikeWebKit(){
  const ua = navigator.userAgent;
  if(/iPad|iPhone|iPod/.test(ua)) return true;
  if(/Macintosh/.test(ua) && navigator.maxTouchPoints > 1) return true;   /* iPad desktop mode */
  return /Safari/.test(ua) && !/Chrome|Chromium|Android|Edg|OPR/.test(ua);
}
async function probeShadowBlur(){
  if(shadowBlurOk !== null) return shadowBlurOk;
  if(looksLikeWebKit()){ shadowBlurOk = false; return shadowBlurOk; }
  try{
    const svg =
      '<svg xmlns="http://www.w3.org/2000/svg" width="60" height="60">' +
      '<foreignObject x="0" y="0" width="60" height="60">' +
      '<div xmlns="http://www.w3.org/1999/xhtml" style="width:60px;height:60px;background:#fff">' +
      '<div style="width:20px;height:20px;margin:20px;background:#fff;box-shadow:0 0 12px 0 #000"></div>' +
      '</div></foreignObject></svg>';
    const img = await loadImg("data:image/svg+xml;charset=utf-8," + encodeURIComponent(svg));
    if(!img){ shadowBlurOk = false; return shadowBlurOk; }
    const cv = document.createElement("canvas");
    cv.width = cv.height = 60;
    const cx = cv.getContext("2d");
    cx.fillStyle = "#fff"; cx.fillRect(0,0,60,60);
    cx.drawImage(img,0,0);
    /* 5 px outside the inner box: grey means the blur was drawn, white means it was not */
    shadowBlurOk = cx.getImageData(15,30,1,1).data[0] < 235;
  }catch(e){ shadowBlurOk = false; }
  return shadowBlurOk;
}
function addRings(wrap, w, h, radius, y, blur, alpha, n){
  const reach = blur * 0.55;
  for(let i = n; i >= 1; i--){
    const f = i/n, e = reach*f, oy = y*f;
    const ring = document.createElement("div");
    ring.style.cssText =
      `position:absolute;left:${-e}px;top:${-e+oy}px;width:${w+2*e}px;height:${h+2*e}px;` +
      `border-radius:${radius + e}px;background:rgba(0,0,0,${(alpha/n).toFixed(4)});`;
    wrap.appendChild(ring);
  }
}
/* Give one element a soft shadow made of nested rounded divs, sitting just behind it.
   Returns the nodes/style changes so the export can undo them afterwards. */
function attachFauxShadow(el, y, blur, alpha, n = 8, addTo, undo){
  const parent = el.parentElement;
  if(!parent) return;
  const pcs = getComputedStyle(parent);
  if(pcs.position === "static"){
    undo.push([parent, "position", parent.style.position]);
    parent.style.position = "relative";
  }
  const cs = getComputedStyle(el);
  const w = el.offsetWidth, h = el.offsetHeight;
  const radius = Math.min(parseFloat(cs.borderTopLeftRadius) || 0, Math.min(w, h)/2);
  const left = el.offsetParent === parent ? el.offsetLeft
             : el.getBoundingClientRect().left - parent.getBoundingClientRect().left;
  const top  = el.offsetParent === parent ? el.offsetTop
             : el.getBoundingClientRect().top  - parent.getBoundingClientRect().top;

  undo.push([el, "position", el.style.position], [el, "zIndex", el.style.zIndex]);
  if(cs.position === "static") el.style.position = "relative";
  el.style.zIndex = "1";

  const wrap = document.createElement("div");
  wrap.style.cssText =
    `position:absolute;left:${left}px;top:${top}px;` +
    `width:${w}px;height:${h}px;z-index:0;pointer-events:none;`;
  addRings(wrap, w, h, radius, y, blur, alpha, n);
  parent.insertBefore(wrap, el);
  addTo.push(wrap);
}

/* a soft drop shadow built from nested rounded divs — every engine draws these right */
function buildFauxShadow(frame, radius, y, blur, alpha, n = 10){
  const wrap = document.createElement("div");
  const cs = getComputedStyle(frame);
  wrap.className = "faux-shadow";
  wrap.style.cssText =
    `position:absolute;left:${frame.offsetLeft}px;top:${frame.offsetTop}px;` +
    `width:${frame.offsetWidth}px;height:${frame.offsetHeight}px;z-index:1;pointer-events:none;` +
    `transform:${cs.transform === "none" ? "" : cs.transform};transform-origin:${cs.transformOrigin};`;
  addRings(wrap, frame.offsetWidth, frame.offsetHeight, radius, y, blur, alpha, n);
  return wrap;
}

/* ── Saving, done deterministically ─────────────────────────────────────────
   Safari rasterises the page snapshot before the photos inside it have decoded,
   so the same click randomly produced a full image, a photo-less one, or a blank
   one. The cure is to stop asking it to wait: the snapshot is taken with every
   photo stripped out (pure vector + text, nothing to load), and the photos are
   painted onto the canvas here, where drawing is synchronous.
   ────────────────────────────────────────────────────────────────────────── */
function roundRectPath(ctx, x, y, w, h, r){
  r = Math.max(0, Math.min(r, Math.min(w, h)/2));
  ctx.moveTo(x+r, y);
  ctx.lineTo(x+w-r, y);        ctx.arcTo(x+w, y,     x+w, y+r,   r);
  ctx.lineTo(x+w, y+h-r);      ctx.arcTo(x+w, y+h,   x+w-r, y+h, r);
  ctx.lineTo(x+r, y+h);        ctx.arcTo(x,   y+h,   x,   y+h-r, r);
  ctx.lineTo(x, y+r);          ctx.arcTo(x,   y,     x+r, y,     r);
  ctx.closePath();
}
/* paint an image into a box the way CSS background-size/position would */
function paintImage(ctx, img, b, mode, zoom, px, py){
  const ir = img.naturalWidth / img.naturalHeight;
  let dw, dh;
  if(mode === "custom"){
    const coverPct = Math.max(100, 100 * (b.h/b.w) * ir);
    dw = b.w * (coverPct * zoom / 100) / 100;
    dh = dw / ir;
  } else {
    const fitW = mode === "contain" ? ir > b.w/b.h : ir < b.w/b.h;
    if(fitW){ dw = b.w; dh = b.w / ir; } else { dh = b.h; dw = b.h * ir; }
  }
  const fx = mode === "custom" ? px/100 : 0.5;
  const fy = mode === "custom" ? py/100 : 0.5;
  ctx.drawImage(img, b.x + (b.w - dw)*fx, b.y + (b.h - dh)*fy, dw, dh);
}
function cssGradient(ctx, w, h, deg, c1, c2){
  const a = deg * Math.PI/180;
  const L = Math.abs(w*Math.sin(a)) + Math.abs(h*Math.cos(a));
  const g = ctx.createLinearGradient(
    w/2 - Math.sin(a)*L/2, h/2 + Math.cos(a)*L/2,
    w/2 + Math.sin(a)*L/2, h/2 - Math.cos(a)*L/2);
  g.addColorStop(0, c1); g.addColorStop(1, c2);
  return g;
}

async function exportPng(){
  const live = viewport.querySelector("#canvasEl");
  if(!live) return;
  const label = exportBtn.textContent;
  exportBtn.textContent = t("baking"); exportBtn.disabled = true;

  /* work on a detached copy: the live preview is never touched, so nothing is left
     half-modified if the browser suspends the page while handing over the download */
  const holder = document.createElement("div");
  holder.setAttribute("aria-hidden", "true");
  holder.style.cssText = "position:fixed;left:-99999px;top:0;width:0;height:0;pointer-events:none;";
  const node = live.cloneNode(true);
  node.removeAttribute("id");
  node.style.transform = "none";
  holder.appendChild(node);
  document.body.appendChild(holder);

  try{
    const cv = state.canvas;
    const SCALE = 3;
    const W = node.offsetWidth, H = node.offsetHeight;

    /* the capture cannot cope with a scrollable box, so bake the scroll into a shift */
    const liveSc = live.querySelector(".content");
    const sc = node.querySelector(".content");
    if(liveSc && sc){
      const st = liveSc.scrollTop;
      sc.style.flex = "none";
      sc.style.height = liveSc.clientHeight + "px";
      sc.style.overflow = "hidden";
      if(st) Array.from(sc.children).forEach(k=>{ k.style.transform = `translateY(${-st}px)`; });
    }

    const frame = node.querySelector(".frame");
    if(!frame) throw new Error("no frame");
    frame.style.transform = "none";                 /* measure and capture it upright */
    frame.style.setProperty("--dev-shadow", "none"); /* its shadow is painted here instead */

    const flat = state.exportFlat === "on" ? true
               : state.exportFlat === "off" ? false
               : !(await probeShadowBlur());
    if(flat && state.shadows){
      const P = palette(), junk = [], bin = [];
      const barY = 6, barBlur = P.light ? 24 : 22, barA = P.light ? .24 : .13;
      frame.querySelectorAll(".mini,.tabbar,.tab-search,.play-pill").forEach(el=>{
        el.style.boxShadow = "none";
        attachFauxShadow(el, barY, barBlur, barA, 8, junk, bin);
      });
      frame.querySelectorAll(".cover").forEach(el=>{
        el.style.boxShadow = "none";
        attachFauxShadow(el, 10, 26, .26, 8, junk, bin);
      });
    }

    /* ---- measure every photo, then strip it out of what gets captured ---- */
    const fb = frame.getBoundingClientRect();
    const fw = Math.round(fb.width), fh = Math.round(fb.height);
    const rel = el => { const r = el.getBoundingClientRect();
      return {x:r.left-fb.left, y:r.top-fb.top, w:r.width, h:r.height}; };
    const radOf = el => parseFloat(getComputedStyle(el).borderTopLeftRadius) || 0;
    const urlOf = el => {
      const bi = el.style.backgroundImage;
      if(!bi || bi.indexOf("url(") !== 0) return null;
      return bi.slice(4, -1).replace(/^["']|["']$/g, "");
    };

    const inner = [], loads = [];
    const grab = (el, bucket) => {
      const u = urlOf(el);
      if(!u) return;
      bucket.push({url:u, box:rel(el), r:radOf(el)});
      el.style.backgroundImage = "none";
    };
    frame.querySelectorAll(".cover,.tk-art").forEach(el => grab(el, inner));
    const miniArt = [];
    frame.querySelectorAll(".mini-art").forEach(el => grab(el, miniArt));

    const screenEl = frame.querySelector(".screen");
    const screenBox = rel(screenEl), screenR = outerRadius();
    const contentBox = sc ? rel(sc) : null;
    const barBoxes = [];
    frame.querySelectorAll(".mini,.tabbar,.tab-search").forEach(el=>{
      barBoxes.push({box:rel(el), r:radOf(el)});
    });

    /* backdrop photo is painted straight onto the canvas, never captured */
    const bgFill = node.querySelector(".bg-fill");
    let bgUrl = null;
    if(bgFill){ bgUrl = urlOf(bgFill); bgFill.remove(); }
    const bgDim = node.querySelector(".bg-dim");
    if(bgDim) bgDim.remove();

    const need = [...inner, ...miniArt].map(p=>p.url);
    if(bgUrl) need.push(bgUrl);
    const imgs = new Map();
    await Promise.all([...new Set(need)].map(async u=>{
      const im = await loadImg(u);
      if(im){ try{ if(im.decode) await im.decode(); }catch(e){} imgs.set(u, im); }
    }));

    /* ---- the one capture: vector and text only, nothing to wait for ---- */
    const phoneUrl = await htmlToImage.toPng(frame, {
      pixelRatio: SCALE, skipFonts: true, cacheBust: false, width: fw, height: fh
    });
    const phoneImg = await loadImg(phoneUrl);
    if(!phoneImg) throw new Error("capture failed");
    try{ if(phoneImg.decode) await phoneImg.decode(); }catch(e){}

    /* ---- compose ---- */
    const out = document.createElement("canvas");
    out.width = Math.round(W*SCALE); out.height = Math.round(H*SCALE);
    const ctx = out.getContext("2d");
    ctx.scale(SCALE, SCALE);
    ctx.imageSmoothingQuality = "high";

    if(cv.on){
      ctx.save();
      ctx.beginPath(); roundRectPath(ctx, 0, 0, W, H, cv.radius); ctx.clip();
      if(cv.mode === "image" && bgUrl && imgs.get(bgUrl)){
        ctx.fillStyle = cv.c1; ctx.fillRect(0,0,W,H);
        paintImage(ctx, imgs.get(bgUrl), {x:0,y:0,w:W,h:H}, cv.fit, cv.zoom, cv.px, cv.py);
      } else if(cv.mode === "gradient"){
        ctx.fillStyle = cssGradient(ctx, W, H, cv.angle, cv.c1, cv.c2); ctx.fillRect(0,0,W,H);
      } else {
        ctx.fillStyle = cv.c1; ctx.fillRect(0,0,W,H);
      }
      if(cv.dim > 0){ ctx.fillStyle = `rgba(0,0,0,${cv.dim/100})`; ctx.fillRect(0,0,W,H); }
      ctx.restore();
    }

    /* the phone sits centred, under whatever scale and tilt the backdrop applies */
    const ds = cv.on ? Math.max(0.2, (cv.devScale ?? 100)/100) : 1;
    ctx.save();
    ctx.translate(W/2, H/2);
    if(cv.on && cv.tilt) ctx.rotate(cv.tilt * Math.PI/180);
    ctx.scale(ds, ds);
    ctx.translate(-fw/2, -fh/2);

    if(state.shadows && cv.shadow > 0){
      const sh = cv.shadow;
      const y = 10 + sh*0.42, blur = 24 + sh*0.85, alpha = 0.06 + sh*0.0035;
      const radius = state.frameOn ? DEVICES[state.device].br : screenR;
      const n = 10, reach = blur*0.55;
      for(let i = n; i >= 1; i--){
        const f = i/n, e = reach*f, oy = y*f;
        ctx.beginPath();
        roundRectPath(ctx, -e, -e+oy, fw+2*e, fh+2*e, radius+e);
        ctx.fillStyle = `rgba(0,0,0,${alpha/n})`;
        ctx.fill();
      }
    }

    ctx.drawImage(phoneImg, 0, 0, fw, fh);

    /* photos that live inside the screen, clipped like the real layout clips them */
    if(inner.length){
      ctx.save();
      ctx.beginPath(); roundRectPath(ctx, screenBox.x, screenBox.y, screenBox.w, screenBox.h, screenR); ctx.clip();
      if(contentBox){
        ctx.beginPath(); ctx.rect(contentBox.x, contentBox.y, contentBox.w, contentBox.h); ctx.clip();
      }
      if(barBoxes.length){        /* the floating bars sit on top of the list */
        ctx.beginPath();
        ctx.rect(screenBox.x, screenBox.y, screenBox.w, screenBox.h);
        barBoxes.forEach(b => roundRectPath(ctx, b.box.x, b.box.y, b.box.w, b.box.h, b.r));
        ctx.clip("evenodd");
      }
      inner.forEach(p=>{
        const im = imgs.get(p.url); if(!im) return;
        ctx.save();
        ctx.beginPath(); roundRectPath(ctx, p.box.x, p.box.y, p.box.w, p.box.h, p.r); ctx.clip();
        paintImage(ctx, im, p.box, "cover");
        ctx.restore();
      });
      ctx.restore();
    }
    miniArt.forEach(p=>{
      const im = imgs.get(p.url); if(!im) return;
      ctx.save();
      ctx.beginPath(); roundRectPath(ctx, p.box.x, p.box.y, p.box.w, p.box.h, p.r); ctx.clip();
      paintImage(ctx, im, p.box, "cover");
      ctx.restore();
    });
    ctx.restore();

    const blob = await new Promise(res => out.toBlob(res, "image/png"));
    if(!blob) throw new Error("empty blob");
    const stamp = new Date().toISOString().slice(0,16).replace(/[:T]/g,"");
    download(blob, `apple-music-${stamp}.png`);
  }catch(err){
    alert(t("errExport"));
    console.error(err);
  }finally{
    holder.remove();
    exportBtn.textContent = label; exportBtn.disabled = false; applyChrome();
  }
}
exportBtn.onclick = exportPng;

/* keys the saved file doesn't know about keep their current default */
function mergeDefaults(val, def){
  if(Array.isArray(def)) return Array.isArray(val) ? val : def;
  if(def && typeof def === "object"){
    const out = {};
    Object.keys(def).forEach(k => out[k] = mergeDefaults(val ? val[k] : undefined, def[k]));
    if(val && typeof val === "object")
      Object.keys(val).forEach(k => { if(!(k in out)) out[k] = val[k]; });
    return out;
  }
  return (val === undefined || val === null) ? def : val;
}
function saveJson(){
  const blob = new Blob([JSON.stringify({_v:2, ...state},null,2)],{type:"application/json"});
  download(blob, "apple-music-maker.json");
}
function loadJson(){
  const inp = document.createElement("input");
  inp.type="file"; inp.accept="application/json,.json";
  inp.addEventListener("change",()=>{
    const f=inp.files&&inp.files[0]; if(!f) return;
    const r=new FileReader();
    r.onload=()=>{
      try{
        const data = JSON.parse(r.result);
        const merged = structuredClone(mergeDefaults(data, DEFAULTS));
        merged.tracks = (Array.isArray(data.tracks) && data.tracks.length ? data.tracks : DEFAULTS.tracks)
          .map(t => Object.assign(newTrack(), t));
        Object.keys(DEFAULTS).forEach(k=>{ state[k] = merged[k]; });
        fillLangs(); applyChrome(); renderScreen(); renderPanel();
      }catch(e){ alert(t("errJson")); }
    };
    r.readAsText(f);
  });
  inp.click();
}

/* ============================================================
   11. BOOT
   ============================================================ */
const DEFAULTS = structuredClone(state);
fillLangs();
applyChrome();
renderScreen();
renderPanel();
requestAnimationFrame(()=>fitIfAuto());
</script>
